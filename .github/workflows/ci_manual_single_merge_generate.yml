name: Manual Single File Execute-Store-Generate HTML
on:
  workflow_dispatch:
    inputs:
      filename:
        description: 'Notebook file name:'
        required: true
        default: 'notebook.ipynb'

jobs:
  GenerateHTML:
   uses: spacetelescope/notebook-ci-actions/.github/workflows/notebook-ci-unified.yml@v1
   with:
      execution-mode: 'on-demand'
      trigger-event: 'all'
      python-version: ${{ vars.PYTHON_VERSION || '3.12' }}
      single-notebook: ${{ github.event.inputs.filename }}
      enable-html-build: true
   secrets:
      CASJOBS_PW: ${{ secrets.CASJOBS_PW }}
      CASJOBS_USERID: ${{ secrets.CASJOBS_USERID }}
   permissions:
     contents: write
