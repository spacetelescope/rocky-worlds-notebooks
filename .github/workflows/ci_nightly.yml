name: Scheduled Notebook Execution
on:
  schedule:
    #- cron: '0 3 * * *' # run at 2 AM UTC
    - cron: '0 0 * * 0' # midnight sunday UTC

jobs:
  Scheduled:
   uses: spacetelescope/notebook-ci-actions/.github/workflows/notebook-ci-unified.yml@v1
   with:
      execution-mode: 'scheduled'
      python-version: ${{ vars.PYTHON_VERSION || '3.12' }}
   permissions:
     contents: write
